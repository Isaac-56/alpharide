plugins {
    id "com.android.application"
    id "kotlin-android"

    id "com.google.gms.google-services"

    id "dev.flutter.flutter-gradle-plugin"
}

def alphaSigning = new Properties()
def alphaSigningFile = rootProject.file("key.properties")
if (alphaSigningFile.exists()) {
    alphaSigningFile.withInputStream { alphaSigning.load(it) }
}
def alphaCiBuild = System.getenv("CI") == "true"
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") } && !alphaSigningFile.exists() && !alphaCiBuild) {
    throw new GradleException("Release signing is missing. Configure android/key.properties with the existing production keystore. Debug/profile builds remain available for testing.")
}

android {
    namespace = "com.alpharideapp.passengerapp"

    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.alpharideapp.passengerapp"

        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36

        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (alphaSigningFile.exists()) {
            release {
                keyAlias alphaSigning['keyAlias']
                keyPassword alphaSigning['keyPassword']
                storeFile file(alphaSigning['storeFile'])
                storePassword alphaSigning['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = alphaSigningFile.exists() ? signingConfigs.release : null
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:32.2.0")
}

