name: iOS compile check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', 'lib/main.dart', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/ios-build.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
